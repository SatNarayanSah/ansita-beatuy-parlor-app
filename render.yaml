# Render Blueprint: New > Blueprint in the Render dashboard, then pick this repo.
services:
  - type: web
    name: ansita-api
    runtime: python
    plan: free
    region: singapore # same region as the Neon database (ap-southeast-1)
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # The seed is idempotent: it only adds rows that don't exist yet.
    startCommand: python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL # Neon or Supabase Postgres connection string
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Email codes (sign-up verification, password reset) over SMTP, e.g. Gmail with an
      # App Password. Render's free plan blocks outgoing SMTP: use a paid instance.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: MAIL_FROM_NAME
        value: Ansita Beauty Parlour
      - key: MAIL_LOGO_URL
        sync: false
      # Render's free plan blocks SMTP, so emailed sign-up codes are switched off here.
      # Set to "true" after moving to a paid instance (SMTP allowed).
      - key: EMAIL_VERIFICATION_ENABLED
        value: "false"
      # Only used while no email provider is set: shows codes on screen instead of emailing.
      - key: EXPOSE_RESET_CODE
        value: "true"
